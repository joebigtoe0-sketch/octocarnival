[build]
builder = "nixpacks"

# ── Frontend ─────────────────────────────────────────────────────────────────
# Build-time env vars (VITE_*) must be set in the Railway frontend service:
#   VITE_API_URL          = https://<your-backend>.railway.app
#   VITE_GOOGLE_CLIENT_ID = <your Google OAuth client ID>
#   VITE_SITE_URL         = https://<your-frontend>.railway.app  (link previews on X/TG)
[[services]]
name = "frontend"
source = "frontend"

[services.build]
command = "npm run build"

[services.deploy]
startCommand = "npx serve dist -s -l $PORT"
healthcheckPath = "/"

# ── Backend ──────────────────────────────────────────────────────────────────
# Required env vars on the Railway backend service:
#   NODE_ENV       = production
#   DATABASE_URL   = (auto-injected by Railway Postgres plugin)
#   REDIS_URL      = (auto-injected by Railway Redis plugin)
#   JWT_SECRET     = <random 64-char string>
#   FRONTEND_URL   = https://<your-frontend>.railway.app
#   GOOGLE_CLIENT_ID = <your Google OAuth client ID>
#   SOLANA_RPC_URL, METAPLEX_COLLECTION_ADDRESS, MINT_AUTHORITY_SECRET, etc.
[[services]]
name = "backend"
source = "."

[services.build]
command = "npm install -w scraprats-backend && node backend/scripts/bundle-sprites.js && npm rebuild sharp -w scraprats-backend"

[services.deploy]
startCommand = "npm run migrate -w scraprats-backend && npm run start -w scraprats-backend"
healthcheckPath = "/health"

# ── Plugins ──────────────────────────────────────────────────────────────────
[[services]]
name = "postgres"
plugin = "postgresql"

[[services]]
name = "redis"
plugin = "redis"
