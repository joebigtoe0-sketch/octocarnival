<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e0e07">

  <title>ScrapRats — Sewer Idle Clicker</title>
  <meta name="description" content="Born in the gutter. Rich in the sludge. Smash sewer enemies, hire a misfit crew, hoard loot — free in your browser. No download. No wallet needed to play.">
  <meta name="application-name" content="ScrapRats">
  <link rel="canonical" href="__CANONICAL__">

  <!-- Favicon & home-screen icon -->
  <link rel="icon" type="image/png" href="/assets/scrapratslogo.png">
  <link rel="apple-touch-icon" href="/assets/scrapratslogo.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Open Graph (Facebook, Telegram, Discord, iMessage, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ScrapRats">
  <meta property="og:title" content="ScrapRats — Sewer Idle Clicker">
  <meta property="og:description" content="Smash sewer enemies, hire a crew of misfits, hoard loot like your life depends on it. Free browser game — no download, no wallet needed.">
  <meta property="og:image" content="__OG_IMAGE__">
  <meta property="og:image:alt" content="ScrapRats — rat in the sewer">
  <meta property="og:url" content="__CANONICAL__">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@scrapratsfun">
  <meta name="twitter:title" content="ScrapRats — Sewer Idle Clicker">
  <meta name="twitter:description" content="Smash sewer enemies, hire a crew, hoard loot. Free in your browser — no download, no wallet needed to play.">
  <meta name="twitter:image" content="__OG_IMAGE__">
  <meta name="twitter:image:alt" content="ScrapRats — rat in the sewer">

  <!-- Prevent white flash while JS loads -->
  <style>
    body{margin:0;background:#0e0e07;overflow-x:hidden}
    /* root scrolls naturally; the game section contains its own overflow */
    #root{width:100vw}
    .sr-page{width:100%;min-height:100vh}
    .sr-game-section{width:100vw;height:100vh;height:100dvh;overflow:hidden;position:relative}
  </style>
  <!-- Preload the two biggest images so the browser fetches them in parallel with JS -->
  <link rel="preload" href="/assets/background.png"  as="image">
  <link rel="preload" href="/assets/background2.png" as="image">
  <link rel="preload" href="/assets/enemy1.png"      as="image">
  <link rel="preload" href="/assets/enemy2.png"      as="image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;700&family=Oxanium:wght@400;600;700;800&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
